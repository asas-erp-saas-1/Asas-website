    <rect x="260" y="70" width="220" height="115" rx="12" fill="#17232A"/><rect x="275" y="83" width="190" height="86" rx="6" fill="#F8F7F2"/><text x="292" y="106" class="small ink">768–1024 px</text><rect x="292" y="120" width="80" height="12" rx="6" fill="#183C31"/><rect x="380" y="120" width="60" height="12" rx="6" fill="#E9E4D8"/>
    <rect x="530" y="70" width="310" height="115" rx="10" fill="#17232A"/><rect x="545" y="83" width="280" height="86" rx="6" fill="#F8F7F2"/><text x="565" y="106" class="small ink">1280–1536 px</text><rect x="565" y="120" width="125" height="12" rx="6" fill="#183C31"/><rect x="705" y="120" width="90" height="12" rx="6" fill="#E9E4D8"/>
