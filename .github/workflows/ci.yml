# ASAS Real Estate — Continuous Integration
#
# CI validates the production PostgreSQL/Prisma application path without
# connecting to production data. Database migrations are never executed
# automatically.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/asas_ci"
      DIRECT_URL: "postgresql://postgres:postgres@127.0.0.1:5432/asas_ci"
      SHADOW_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/asas_ci_shadow"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (production schema)
        run: bun run db:generate

      - name: Generate Prisma baseline candidate
        run: |
          mkdir -p docs
          bunx prisma migrate diff \
            --from-empty \
            --to-schema prisma/schema.postgres.prisma \
            --script > docs/PHASE2_BASELINE_CANDIDATE.sql

      - name: Verify baseline candidate is non-empty
        run: test -s docs/PHASE2_BASELINE_CANDIDATE.sql

      - name: Upload Prisma baseline candidate
        uses: actions/upload-artifact@v4
        with:
          name: phase2-prisma-baseline-candidate
          path: docs/PHASE2_BASELINE_CANDIDATE.sql
          if-no-files-found: error

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
