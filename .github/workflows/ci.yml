# ASAS Real Estate — Continuous Integration
#
# Runs on every pull request and on push to main.
# Pipeline: install → lint → typecheck → build.
# Database migrations are NOT run from CI — production migrations are run
# deliberately by an operator via `bun run db:migrate:deploy` (see
# docs/PRODUCTION_DEPLOYMENT.md). This avoids accidental destructive
# schema changes from a CI context.
#
# Caching:
#   - Bun's global cache (~/.bun/install/cache) is cached by lockfile hash.
#   - Next.js build cache (.next/cache) is cached by branch.
#   - Prisma generated client is cached by schema hash.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-flight runs when a PR is updated (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Use the bundled SQLite DB (committed empty schema) for the build.
      # We do NOT connect to a real DB in CI — Prisma generate + build
      # doesn't need a live connection.
      DATABASE_URL: "file:./db/custom.db"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.x

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
            .next/types
          key: ${{ runner.os }}-next-${{ github.ref }}-${{ hashFiles('**/*.ts', '**/*.tsx', 'prisma/schema.prisma') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ github.ref }}-
            ${{ runner.os }}-next-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build
        env:
          # Next.js needs to know we're not in dev for the build.
          NODE_ENV: production
          # Disable telemetry to keep CI logs clean.
          NEXT_TELEMETRY_DISABLED: "1"
