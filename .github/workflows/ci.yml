# ASAS Real Estate — Continuous Integration
#
# CI validates the production PostgreSQL/Prisma application path without
# connecting to production data. Database migrations are never executed
# automatically.

name: CI

on:
  push:
    branches:
      - main
      - master
      - '**'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/asas_ci"
      DIRECT_URL: "postgresql://postgres:postgres@127.0.0.1:5432/asas_ci"
      SHADOW_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/asas_ci_shadow"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Cache Bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client (production schema)
        run: bun run db:generate

      - name: Generate Prisma baseline candidate
        run: |
          mkdir -p docs
          bunx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.postgres.prisma \
            --script > docs/PHASE2_BASELINE_CANDIDATE.sql

      - name: Verify baseline candidate is non-empty
        run: test -s docs/PHASE2_BASELINE_CANDIDATE.sql

      - name: Upload Prisma baseline candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase2-prisma-baseline-candidate
          path: docs/PHASE2_BASELINE_CANDIDATE.sql
          if-no-files-found: error

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
